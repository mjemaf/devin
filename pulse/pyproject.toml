[project]
name = "pulse"
version = "0.1.0"
description = "Pulse — risk and compliance intelligence platform for a fintech (reference implementation)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "networkx>=3.2",
    "rapidfuzz>=3.9.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# B008: FastAPI's Depends/Query defaults are function calls by design.
# UP038: isinstance tuples read better than unions in the recursive JSON coercion helpers.
ignore = ["B008", "UP038"]

[tool.mypy]
python_version = "3.10"
files = ["backend/app"]
mypy_path = "backend"
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_explicit = false
no_implicit_optional = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
