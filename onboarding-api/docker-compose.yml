services:
  postgres:
    image: postgres:16-alpine
    container_name: onboarding-api-postgres
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    ports:
      - '5433:5432'
    volumes:
      - onboarding-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onboarding']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onboarding-pgdata:
