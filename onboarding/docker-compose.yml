services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding
    ports:
      - '5432:5432'
    volumes:
      - onboarding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onboarding']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  onboarding_pgdata:
